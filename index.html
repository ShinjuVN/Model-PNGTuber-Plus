function model(t,cl,op){const s=`translate(${lx*4} ${ly*3})`;E.eL.setAttribute('transform',s);E.eR.setAttribute('transform',s);
E.bl.style.display=cl?'':'none';E.mo.style.display=op?'':'none';E.bub.style.display=emote?'':'none';
if(op)E.mom.setAttribute('transform',`translate(512 240) scale(${.75+lvl*.35} ${.3+lvl*.8})`);
const bob=-lvl*1.5+Math.sin(t*2)*1.5;
E.hd.setAttribute('transform',`translate(${lx*4} ${bob+ly*2}) rotate(${lx*3} 512 285)`);
E.all.setAttribute('transform',`translate(0 ${-lvl*4}) translate(512 1530) rotate(${lx*.6}) scale(1 ${1+Math.sin(t*2)*.004}) translate(-512 -1530)`)}

function setBg(v){bg=v;$('#bgs').value=v;R.classList.toggle('alpha',v=='transparent');R.style.setProperty('--sb',v);try{localStorage.setItem('pngmk2',JSON.stringify({e:emote,b:bg,s:spOn|0}))}catch(e){}}
$('#bgs').onchange=e=>setBg(e.target.value);
$('#emo').onclick=()=>{emote=!emote;setBg(bg)};
const gui=v=>R.classList.toggle('idle',!v);
let sp=0,mx=innerWidth/2,my=innerHeight/2,an,buf,micOn=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(document.hasFocus())gui(1)});
R.addEventListener('mouseleave',()=>gui(0));
addEventListener('blur',()=>gui(0));
document.addEventListener('visibilitychange',()=>{if(document.hidden)gui(0)});
addEventListener('keydown',e=>{if(e.key==' '&&spOn){sp=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==' '){sp=0;if(spOn)e.preventDefault()}});
$('#spk').checked=!!spOn;$('#spk').onchange=e=>{spOn=e.target.checked;sp=0;setBg(bg)};
document.addEventListener('click',e=>{if(e.target.matches('button,input,select'))e.target.blur()});
$('#mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new AudioContext();an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(s).connect(an);buf=new Uint8Array(1024);micOn=1;$('#mic').textContent='🎤 Đang nghe';$('#msg').textContent=''}catch(x){$('#msg').textContent='Không bật được mic (trình duyệt chặn?). Dùng giữ Space để thử.'}};
let lx=0,ly=0,lvl=0,blinkAt=1500,blinkEnd=0;const sens=$('#sens'),lv=$('#lv');
function loop(now){
const t=now/1000;
const tx=clamp((mx-innerWidth/2)/(innerWidth/2.2),-1,1),ty=clamp((my-innerHeight*.25)/(innerHeight/2.2),-1,1);
lx+=(tx-lx)*.15;ly+=(ty-ly)*.15;
let raw=0;if(micOn){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}raw=Math.sqrt(s/buf.length)*sens.value}
lvl+=((sp?.7+Math.sin(t*18)*.2:raw)-lvl)*.4;lvl=clamp(lvl,0,1);lv.style.width=lvl*100+'%';
if(now>blinkAt){blinkEnd=now+140;blinkAt=now+2000+Math.random()*3500}
model(t,now<blinkEnd?1:0,lvl>.1?1:0);
requestAnimationFrame(loop)}
$('#view').innerHTML=modelSvg();
{const g=i=>$('#'+i);E={m:1,all:g('all'),bd:g('bd'),hd:g('hd'),eL:g('eL'),eR:g('eR'),bl:g('bl'),mo:g('mo2'),mom:g('mom'),bub:g('bub')}}
setBg(location.hash=='#obs'?'transparent':bg);R.classList.add('idle');
requestAnimationFrame(loop);
</script></body></html>
