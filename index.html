<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PNGTuber Maker</title>
<style>
:root{--bg:#f4f1ec;--pn:#fff;--tx:#241f2b;--mu:#7a7285;--ac:#d6457f;--ln:#e3dde8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--pn:#221e2a;--tx:#f1ecf5;--mu:#a59eb0;--ln:#38313f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141c;--pn:#221e2a;--tx:#f1ecf5;--mu:#a59eb0;--ln:#38313f;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Segoe UI",sans-serif}
.app{display:flex;height:100%}
.stage{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;background:var(--sb,#00b140)}
#view{flex:1;min-height:0;display:flex;justify-content:center}
#view svg{height:100%;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.bar button,.bar select{background:#fff;color:#222;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.bar input[type=range]{width:90px}
#lvw{width:70px;height:8px;background:#fff4;border-radius:4px;overflow:hidden}#lv{height:100%;width:0;background:#6fe39a}
.panel{width:340px;background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.tabs button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;padding:8px;overflow:auto;flex:1;align-content:start}
.opt{aspect-ratio:1;border:2px solid var(--ln);border-radius:10px;background:var(--bg);cursor:pointer;padding:2px;color:var(--mu);font:inherit;font-size:12px}
.opt.on{border-color:var(--ac)}.opt svg{width:100%;height:100%}
.colors{padding:8px;border-top:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);cursor:pointer;padding:0}
.colors input[type=color]{width:34px;height:28px;border:0;background:none;padding:0}
.colors button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 8px;cursor:pointer;font:inherit;font-size:12px}
.present .panel,.present .bar{display:none}
@media(max-width:820px){.app{flex-direction:column}.stage{flex:none;height:55%}.panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--ln)}}
.alpha{--sb:transparent!important}
.alpha #view{background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/24px 24px}
.present .alpha #view{background:none}
html:has(.alpha){color-scheme:normal}
html:has(.present .alpha),html:has(.present .alpha) body{background:transparent}
.model .panel{display:none}
@media(max-width:820px){.model .stage{height:100%}}
</style></head><body>
<div class="app" id="app">
<main class="stage" id="stage"><div id="view"></div>
<div class="bar"><button id="mic">🎤 Bật mic</button><div id="lvw"><div id="lv"></div></div>
<label>Nhạy <input type="range" id="sens" min="2" max="40" value="14"></label>
<button id="rnd">🎲 Ngẫu nhiên</button><button id="mdl">🧍 Model của bạn</button><button id="emo">💬 Emote</button>
<select id="bgs"><option value="#00b140">Nền xanh lá (chroma)</option><option value="#0047bb">Nền xanh dương</option><option value="#ff00ff">Nền hồng (chroma)</option><option value="#2b2833">Nền tối</option><option value="#f2efe9">Nền sáng</option><option value="transparent">Trong suốt (alpha)</option></select>
<button id="pres">⛶ Trình chiếu</button><span id="msg">Giữ Space = nói thử</span></div></main>
<aside class="panel"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="colors" id="cols"></div></aside>
</div>
